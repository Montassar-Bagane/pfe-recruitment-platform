<app-header></app-header>
<div class="container">
  <div class="card">
    <form nzLayout="vertical" nz-form [formGroup]="validateForm" class="login-form" (ngSubmit)="submitForm()">
      <nz-form-item>
        <nz-form-label nzFor="Password" nzRequired>New Password</nz-form-label>
        <nz-form-control nzErrorTip="New Password is required">
          <nz-input-group nzPrefixIcon="lock">
            <input type="password" id="password" nz-input formControlName="password" placeholder="New Password" (input)="checkPasswords()" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="confirmPassword" nzRequired>Confirm New Password</nz-form-label>
        <nz-form-control [nzErrorTip]="validateForm.get('confirmPassword')!.hasError('mustMatch') ? 'Passwords must match.' : ''">
          <nz-input-group nzPrefixIcon="lock">
            <input type="password" id="confirmPassword" nz-input formControlName="confirmPassword" placeholder="Confirm New Password" (input)="checkPasswords()" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
      <button nz-button class="login-form-button login-form-margin" [nzType]="'primary'">Change Password</button>
    </form>
  </div>
</div>
<app-footer></app-footer>

<h1>List offer</h1>

<nz-table [nzScroll]="{ x: '1000px', y: '60vh' }" #middleTable nzSize="middle" [nzData]="data">
  <thead>
  <tr>
    <th nzWidth="30px">id</th>
    <th>Entreprise</th>
    <th>Title</th>
    <th>Type</th>
    <th>Salary</th>
    <th>Description</th>
    <th>Action</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let data of middleTable.data">
    <td>{{ data.id }}</td>
    <td>{{ data.company }}</td>
    <td>{{ data.title }}</td>
    <td>{{ data.type }}</td>
    <td>{{ data.salary }} {{data.unit}}/{{data.timeType}}</td>
    <td>{{ data.description }}</td>
    <td>
      <button nz-button nzType="primary" (click)="showConfirm(data.id!)" nzDanger>Delete</button>
    </td>
  </tr>
  </tbody>
</nz-table>

<h1>List Applications</h1>
<nz-table #basicTable [nzScroll]="{ x: '1000px', y: '60vh' }" [nzData]="listSubmit" [nzBordered]="true" [nzSize]="'middle'">
  <thead>
  <tr>
    <th>Title</th>
    <th>Enterprise</th>
    <th>Type</th>
    <th>Status</th>
    <th>Action</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let list of listSubmit">
    <td>{{ list.title }}</td>
    <td>{{ list.company }}</td>
    <td>{{ list.type }}</td>
    <td>
      <nz-alert *ngIf="list.status === 'ACCEPTED'" nzType="success" nzMessage="Accepted"></nz-alert>
      <nz-alert *ngIf="list.status === 'IN_PROCESS'" nzType="info" nzMessage="In Proccess"></nz-alert>
      <nz-alert *ngIf="list.status === 'REFUSED'" nzType="error" nzMessage="Refused"></nz-alert>
    </td>    
    <td>
      <button nz-button nzType="primary" (click)="showConfirm(list.id!)" nzDanger>Cancel</button>
    </td>
  </tr>
  </tbody>
</nz-table>

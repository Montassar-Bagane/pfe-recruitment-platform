<app-header></app-header>
<div class="container">
  <div class="card">
    <form nzLayout="vertical" nz-form [formGroup]="validateForm" class="login-form" (ngSubmit)="submitForm()">
      <h1>Email Validation</h1>
      <nz-form-item>
        <nz-form-label nzFor="email">Enter your Email</nz-form-label>
        <nz-form-control nzErrorTip="Email is required!">
          <nz-input-group nzPrefixIcon="user">
            <input id="email" type="text" nz-input formControlName="userName" placeholder="Email" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
      <button nz-button class="login-form-button login-form-margin" [nzType]="'primary'">Submit</button>
    </form>
  </div>
</div>
<app-footer></app-footer>
